<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dungeon Quest — Free Pixel Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- Back button -->
    <a href="../../index.html" class="back-btn" id="back-btn" title="Back to Game Library">
        ← BACK
    </a>

    <!-- Top floating HUD controls -->
    <div class="hud-controls" id="hud-controls">
        <button class="action-btn" id="btn-sound" title="Toggle Sound">🔊 SOUND</button>
        <button class="action-btn" id="btn-pause" title="Pause Game">⏸ PAUSE</button>
        <button class="action-btn" id="btn-restart" title="Restart Quest">🔄 RESTART</button>
    </div>

    <!-- Mobile Virtual Controls -->
    <div class="mobile-controls" id="mobile-controls">
        <div class="dpad-cluster">
            <button class="dpad-btn dpad-up" id="btn-up" aria-label="Move Up">▲</button>
            <div class="dpad-middle">
                <button class="dpad-btn dpad-left" id="btn-left" aria-label="Move Left">◀</button>
                <div class="dpad-center"></div>
                <button class="dpad-btn dpad-right" id="btn-right" aria-label="Move Right">▶</button>
            </div>
            <button class="dpad-btn dpad-down" id="btn-down" aria-label="Move Down">▼</button>
        </div>
        <div class="action-cluster">
            <button class="action-circle-btn btn-dash" id="btn-dash" aria-label="Dash / Dodge">⚡ DASH</button>
            <button class="action-circle-btn btn-spell" id="btn-spell" aria-label="Magic Fireball">🔥 SPELL</button>
            <button class="action-circle-btn btn-attack" id="btn-attack" aria-label="Sword Slash">⚔️ SLASH</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
