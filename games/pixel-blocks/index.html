<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Blocks — Free Pixel Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- Back button -->
    <a href="../../index.html" class="back-btn" id="back-btn" title="Back to Game Library">
        ← BACK
    </a>

    <!-- Mobile On-Screen Controls -->
    <div class="mobile-controls" id="mobile-controls">
        <div class="dpad-cluster">
            <button class="ctrl-btn" id="btn-left" aria-label="Left">◀</button>
            <button class="ctrl-btn" id="btn-down" aria-label="Soft Drop">▼</button>
            <button class="ctrl-btn" id="btn-right" aria-label="Right">▶</button>
        </div>
        <div class="action-cluster">
            <button class="ctrl-btn action-yellow" id="btn-hold" aria-label="Hold">HOLD</button>
            <button class="ctrl-btn action-cyan" id="btn-rotate" aria-label="Rotate">↻</button>
            <button class="ctrl-btn action-pink" id="btn-drop" aria-label="Hard Drop">DROP</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
