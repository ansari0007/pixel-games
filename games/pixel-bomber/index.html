<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Bomber — Free Pixel Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- Back button -->
    <a href="../../index.html" class="back-btn" id="back-btn" title="Back to Game Library">
        ← BACK
    </a>

    <!-- Mobile On-Screen Controls -->
    <div class="mobile-controls" id="mobile-controls">
        <div class="dpad-container">
            <button class="dpad-btn dpad-up" id="btn-up" aria-label="Up">▲</button>
            <div class="dpad-middle">
                <button class="dpad-btn dpad-left" id="btn-left" aria-label="Left">◀</button>
                <div class="dpad-center"></div>
                <button class="dpad-btn dpad-right" id="btn-right" aria-label="Right">▶</button>
            </div>
            <button class="dpad-btn dpad-down" id="btn-down" aria-label="Down">▼</button>
        </div>
        <div class="action-container">
            <button class="action-bomb-btn" id="btn-bomb" aria-label="Drop Bomb">💣 BOMB</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
