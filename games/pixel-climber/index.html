<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Climber — Free Pixel Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <!-- Mobile Touch Controls -->
        <div class="mobile-controls" id="mobile-controls">
            <button class="ctrl-btn btn-left" id="btn-left" aria-label="Move Left">◀</button>
            <button class="ctrl-btn btn-shoot" id="btn-shoot" aria-label="Shoot Pellet">🎯</button>
            <button class="ctrl-btn btn-right" id="btn-right" aria-label="Move Right">▶</button>
        </div>
    </div>

    <!-- Back button -->
    <a href="../../index.html" class="back-btn" id="back-btn" title="Back to Game Library">
        ← BACK
    </a>

    <!-- Top floating HUD controls -->
    <div class="hud-controls" id="hud-controls">
        <button class="action-btn" id="btn-sound" title="Toggle Sound">🔊 SOUND</button>
        <button class="action-btn" id="btn-pause" title="Pause Game">⏸ PAUSE</button>
        <button class="action-btn" id="btn-restart" title="Restart Game">🔄 RESTART</button>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
